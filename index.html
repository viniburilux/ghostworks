<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostWorks — Territorial Intelligence Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020617;
            --bg-panel: #0a0f1d;
            --bg-card: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #475569;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --accent-indigo: #6366f1;
            --accent-emerald: #10b981;
            --accent-cyan: #06b6d4;
            --accent-violet: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ── HUD BACKGROUND ────────────────────────────────────────── */
        .hud-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: -1;
        }

        .hud-scanline {
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 1000;
            opacity: 0.1;
        }

        /* ── LAYOUT ────────────────────────────────────────────────── */
        header {
            padding: 16px 24px;
            background: rgba(10, 15, 29, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.2em;
            color: var(--accent-amber);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-emerald);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* ── SIDEBAR ───────────────────────────────────────────────── */
        .sidebar {
            width: 380px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 24px;
            gap: 16px;
        }

        .sidebar-title {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        /* ── CONTENT ───────────────────────────────────────────────── */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            background: radial-gradient(circle at 50% 0%, rgba(245, 158, 11, 0.03) 0%, transparent 70%);
        }

        .content-inner {
            max-width: 800px;
            margin: 0 auto;
        }

        /* ── CARDS ─────────────────────────────────────────────────── */
        .insight-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .insight-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .insight-card.active {
            background: var(--active-bg);
            border-color: var(--active-border);
        }

        .insight-card.active::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--active-border);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .card-code {
            font-size: 10px;
            font-family: 'Space Mono', monospace;
            letter-spacing: 0.1em;
            font-weight: 700;
        }

        .card-tag {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.08em;
            border: 1px solid currentColor;
        }

        .card-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .card-summary {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* ── DETAIL SECTION ────────────────────────────────────────── */
        .detail-header {
            margin-bottom: 24px;
        }

        .detail-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .detail-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .viz-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .analysis-box {
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .box-label {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 0.12em;
            font-family: 'Space Mono', monospace;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .box-text {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.7;
        }

        .implication-box {
            padding: 20px 24px;
            border-radius: 12px;
            border: 1px solid transparent;
        }

        /* ── VIZ COMPONENTS ────────────────────────────────────────── */
        .viz-row {
            margin-bottom: 12px;
        }

        .viz-label-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .viz-label {
            font-size: 11px;
            font-family: 'Space Mono', monospace;
            color: #cbd5e1;
        }

        .viz-stats {
            display: flex;
            gap: 16px;
            font-size: 11px;
            font-family: 'Space Mono', monospace;
        }

        .bar-container {
            display: flex;
            gap: 4px;
            align-items: center;
            height: 20px;
        }

        .bar-forest {
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--accent-red), #dc2626);
            opacity: 0.7;
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .bar-stt {
            height: 14px;
            border-radius: 4px;
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ── ANIMATIONS ────────────────────────────────────────────── */
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--accent-emerald); }
            50% { opacity: 0.5; box-shadow: 0 0 2px var(--accent-emerald); }
        }

        /* ── MOBILE ────────────────────────────────────────────────── */
        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: 300px;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            body {
                overflow-y: auto;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="hud-grid"></div>
    <div class="hud-scanline"></div>

    <header>
        <div class="logo">
            <div class="logo-dot"></div>
            GHOSTWORKS // INTEL_PLATFORM_V2
        </div>
        <div style="font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text-muted);">
            STATUS: OPERATIONAL // SESSION_ID: 8842-AX
        </div>
    </header>

    <div class="main-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-title">Intelligence Insights</div>
            <!-- Cards will be injected here -->
        </div>

        <div class="content">
            <div class="content-inner" id="detail-content">
                <!-- Detail will be injected here -->
            </div>
        </div>
    </div>

    <script>
        const INSIGHTS = [
            {
                id: "paradox",
                code: "PAR-01",
                title: "O Paradoxo Amazônico",
                severity: "critical",
                tag: "ACHADO CENTRAL",
                summary: "Altamira perde 473.459 ha de floresta. STT = Baixa.",
                detail: "Os municípios com maior perda florestal do Brasil têm os menores STT. Altamira/PA: 473k ha destruídos, STT=0.012. São Félix do Xingu: 392k ha, STT=0.017. Aripuanã/MT: 308k ha, STT=0.011. O desmatamento amazônico, o maior crime ambiental do planeta, é semanticamente INVISÍVEL para o embedding. A floresta vira floresta degradada — e o sinal semântico mal se move.",
                implication: "TTI não é um detector de desmatamento. É um detector de ruptura semântica. Isso é uma limitação E um diferencial: captura o que sistemas convencionais não veem, mas perde o que eles veem bem.",
                data: [
                    { label: "Altamira/PA", forest: 473459, stt: 0.012 },
                    { label: "S.Félix Xingu", forest: 392554, stt: 0.017 },
                    { label: "Aripuanã/MT", forest: 308144, stt: 0.011 },
                    { label: "Porto Velho", forest: 304374, stt: 0.014 },
                    { label: "Labrêa/AM", forest: 279450, stt: 0.009 },
                    { label: "Poconé/MT*", forest: 239449, stt: 0.069 },
                ],
                footnote: "* Poconé é a exceção: Pantanal, fogo 2019-2020, mudança semântica total.",
                color: "#ef4444",
            },
            {
                id: "pulse",
                code: "PUL-01",
                title: "O Pulso de 2021→2022",
                severity: "high",
                tag: "ANOMALIA TEMPORAL",
                summary: "28,9% de todos os municípios brasileiros peakaram no mesmo ano.",
                detail: "1.589 municípios tiveram seu pico de transformação semântica em 2021→2022. É o dobro do segundo colocado (2022→2023: 994). A geografia é reveladora: Paraná (324), Santa Catarina (277), Rio Grande do Sul (227). O Sul do Brasil, não o Nordeste. O que aconteceu? La Niña 2020-2022 trouxe a maior seca do século ao Sul em 2021, seguida de enchentes catastróficas no RS em 2022. O embedding registrou o território mudando — de seco para destruído.",
                implication: "Existe um evento geofísico nacional codificado nesse dataset. A análise temporal do STT pode ser um proxy de extremos climáticos mais poderoso que índices convencionais.",
                data: [
                    { label: "2021→2022", count: 1589, pct: 28.9 },
                    { label: "2022→2023", count: 994, pct: 18.1 },
                    { label: "2019→2020", count: 809, pct: 14.7 },
                    { label: "2023→2024", count: 736, pct: 13.4 },
                    { label: "2020→2021", count: 553, pct: 10.0 },
                    { label: "2018→2019", count: 460, pct: 8.4 },
                    { label: "2017→2024", count: 365, pct: 6.6 },
                ],
                color: "#f59e0b",
            },
            {
                id: "ghost",
                code: "GHO-01",
                title: "62 Municípios Fantasma",
                severity: "high",
                tag: "SINAL NÃO EXPLICADO",
                summary: "Alta STT, nenhum driver convencional detectado.",
                detail: "62 municípios têm STT > 0.065 com perda florestal < 200ha, área agrícola < 5000ha, área urbana < 500ha e NDVI neutro. Algo transformou o território. Os dados convencionais não dizem o quê. Pintadas/BA (rank #15, STT=0.091) é o caso mais extremo. RS domina a lista — mas esses têm dados zerados por gap de cobertura. Bahia e RN têm casos genuínos: transformação real, driver desconhecido. Hipótese primária: infraestrutura de energia renovável.",
                data: [
                    { label: "Pintadas/BA", stt: 0.0912, peak: "2021→2022" },
                    { label: "Barra Quaraí/RS", stt: 0.0856, peak: "2023→2024" },
                    { label: "Ruy Barbosa/RN", stt: 0.0818, peak: "2021→2022" },
                    { label: "Passagem/RN", stt: 0.0764, peak: "2017→2024" },
                    { label: "Laguna Carapã/MS", stt: 0.0763, peak: "2018→2019" },
                    { label: "S. Pedro/RN", stt: 0.0741, peak: "2021→2022" },
                ],
                color: "#8b5cf6",
            },
            {
                id: "ndvi",
                code: "NDV-01",
                title: "Sergipe Verde: STT + NDVI Positivo",
                severity: "medium",
                tag: "REINTERPRETAÇÃO NE",
                summary: "Alta transformação + vegetação crescendo = recuperação de seca?",
                detail: "130 municípios no top 500 têm STT elevado E NDVI positivo (> 0.05). Sergipe domina: Itabi (+0.18), Gararu (+0.16), Canhoba (+0.15). O território transforma E reverdece. Isso sugere que parte do domínio nordestino no ranking pode ser recuperação de vegetação pós-seca (El Niño 2015-16 → La Niña 2020-22), não apenas infraestrutura renovável. A embedding capta a transição 'território seco → território verde' como mudança semântica intensa. Isso é uma REVISÃO da hipótese do preprint v0.6.",
                data: [
                    { label: "Itabi/SE", stt: 0.0625, ndvi: 0.182 },
                    { label: "Gararu/SE", stt: 0.0614, ndvi: 0.162 },
                    { label: "Canhoba/SE", stt: 0.0592, ndvi: 0.152 },
                    { label: "Nova Itarana/BA", stt: 0.0785, ndvi: 0.146 },
                    { label: "Porto da Folha/SE", stt: 0.0577, ndvi: 0.145 },
                    { label: "Cumaru/PE", stt: 0.0609, ndvi: 0.143 },
                ],
                color: "#10b981",
            },
            {
                id: "rs_gap",
                code: "GAP-01",
                title: "RS: 467 Municípios sem Drivers",
                severity: "medium",
                tag: "GAP DE DADOS",
                summary: "O STT vê. O banco de drivers não explica.",
                detail: "467 municípios do Rio Grande do Sul têm forest_loss=0, agri=0, urban=0, NDVI=0 — mas STT real e significativo. O RS também tem n_years=7 (vs 6 dos outros estados), sugerindo cobertura temporal diferente. Isso revela um gap estrutural no banco de drivers: fenômenos que transformam o território semanticamente mas não deixam rastro nos proxies convencionais. As enchentes de 2022 e 2024 no RS são o candidato óbvio: destruição física massiva, sem desmatamento, sem expansão agrícola.",
                color: "#06b6d4",
            },
        ];

        const severityColors = {
            critical: { bg: "rgba(239,68,68,0.12)", border: "#ef4444", label: "CRÍTICO" },
            high: { bg: "rgba(245,158,11,0.12)", border: "#f59e0b", label: "ALTO" },
            medium: { bg: "rgba(99,102,241,0.12)", border: "#6366f1", label: "MÉDIO" },
        };

        let activeId = "paradox";

        function renderSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '<div class="sidebar-title">Intelligence Insights</div>';
            
            INSIGHTS.forEach(insight => {
                const sc = severityColors[insight.severity];
                const card = document.createElement('div');
                card.className = `insight-card ${insight.id === activeId ? 'active' : ''}`;
                if (insight.id === activeId) {
                    card.style.setProperty('--active-bg', sc.bg);
                    card.style.setProperty('--active-border', sc.border);
                }
                
                card.onclick = () => {
                    activeId = insight.id;
                    renderSidebar();
                    renderDetail();
                };

                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-code" style="color: ${sc.border}">${insight.code}</span>
                        <span class="card-tag" style="color: ${sc.border}">${insight.tag}</span>
                    </div>
                    <div class="card-title">${insight.title}</div>
                    <div class="card-summary">${insight.summary}</div>
                `;
                sidebar.appendChild(card);
            });
        }

        function renderDetail() {
            const insight = INSIGHTS.find(i => i.id === activeId);
            const sc = severityColors[insight.severity];
            const container = document.getElementById('detail-content');
            
            let vizHtml = '';
            if (insight.id === 'paradox') {
                const maxForest = Math.max(...insight.data.map(d => d.forest));
                vizHtml = insight.data.map(d => `
                    <div class="viz-row">
                        <div class="viz-label-row">
                            <span class="viz-label" style="color: ${d.label.includes('*') ? '#f59e0b' : '#cbd5e1'}">${d.label}</span>
                            <div class="viz-stats">
                                <span style="color: #64748b">${(d.forest / 1000).toFixed(0)}k ha</span>
                                <span style="color: ${d.stt < 0.02 ? '#ef4444' : '#f59e0b'}">STT ${d.stt.toFixed(3)}</span>
                            </div>
                        </div>
                        <div class="bar-container">
                            <div class="bar-forest" style="width: ${(d.forest / maxForest) * 70}%"></div>
                            <div class="bar-stt" style="width: ${d.stt * 400}%; background: ${d.stt < 0.02 ? '#1e293b' : '#f59e0b'}; border: 1px solid ${d.stt < 0.02 ? '#334155' : '#f59e0b'}"></div>
                        </div>
                    </div>
                `).join('');
            } else if (insight.id === 'pulse') {
                const max = Math.max(...insight.data.map(d => d.count));
                vizHtml = insight.data.map(d => `
                    <div class="viz-row">
                        <div class="viz-label-row">
                            <span class="viz-label" style="color: ${d.pct > 20 ? '#f59e0b' : '#64748b'}">${d.label}</span>
                            <span class="viz-label" style="color: ${d.pct > 20 ? '#f59e0b' : '#64748b'}">${d.count} units</span>
                        </div>
                        <div style="height: 10px; background: ${d.pct > 20 ? '#f59e0b' : 'rgba(100,116,139,0.2)'}; width: ${(d.count/max)*100}%; border-radius: 4px;"></div>
                    </div>
                `).join('');
            } else {
                vizHtml = `<div style="color: var(--text-muted); font-family: 'Space Mono'; font-size: 12px; text-align: center; padding: 40px 0;">[ GEOSPATIAL DATA VISUALIZATION ACTIVE ]</div>`;
            }

            container.innerHTML = `
                <div class="detail-header">
                    <div class="detail-meta">
                        <span class="card-code" style="color: ${sc.border}">${insight.code}</span>
                        <span class="card-tag" style="background: ${sc.bg}; color: ${sc.border}">${insight.tag}</span>
                    </div>
                    <h2 class="detail-title">${insight.title}</h2>
                </div>

                <div class="viz-container">
                    <div class="box-label">Visualização de Evidências</div>
                    ${vizHtml}
                </div>

                <div class="analysis-box">
                    <div class="box-label">Análise de Inteligência</div>
                    <p class="box-text">${insight.detail}</p>
                    ${insight.footnote ? `<p style="font-size: 11px; color: var(--text-muted); mt-12">${insight.footnote}</p>` : ''}
                </div>

                ${insight.implication ? `
                    <div class="implication-box" style="background: ${sc.bg}; border-color: ${sc.border}40">
                        <div class="box-label" style="color: ${sc.border}">Implicação Estratégica</div>
                        <p class="box-text" style="color: #f1f5f9">${insight.implication}</p>
                    </div>
                ` : ''}
            `;
        }

        // Initialize
        renderSidebar();
        renderDetail();
    </script>
</body>
</html>
